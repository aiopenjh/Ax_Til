<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>display와 visibility 실습</title>
    <link rel="stylesheet" href="2026_0926_style.css">
</head>

<body>
    <div class="container">
        <div class="box red">빨강 (기준)</div>
        <div class="box green hide-none">초록 (display: none)</div>
        <div class="box blue">파랑 (이동 여부 확인용)</div>
    </div>
    <hr>
    <div class="container">
        <div class="box red">빨강 (기준)</div>
        <div class="box green hide-hidden">초록 (visibility: hidden)</div>
        <div class="box blue">파랑 (이동 여부 확인용)</div>
    </div>
</body>

</html>

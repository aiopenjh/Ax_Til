<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
</head>

<body>
    <h3>회원가입 란</h1>
        <p>
        <form>
            <label for="userId">아이디 입력</label>
            <input type="text" id="userId"><br>
            <label for="userPassword">비밀번호 입력</label>
            <input type="password" id="userPassword"><br>
            <label for="userPasswordConfirm">비밀번호 확인</label>
            <input type="password" id="userPasswordConfirm"><br>
            <button type="submit">회원가입하기</button>
        </form>
        </p>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Grid Align 실습</title>
    <style>
        .place-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            height: 150px;
            background-color: #334155;
            /* 아래 stretch, start, end, center 값을 변경하여 정렬을 비교해 보세요 */
            place-items: center;
        }

        .text-item {
            background-color: #38bdf8;
            color: #1e293b;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>설정값에 맞춰 동그란 배지가 격자 칸 내 정중앙에 배치됩니다.</h2>
    <div class="place-board">
        <div class="text-item">1</div>
        <div class="text-item">2</div>
        <div class="text-item">3</div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .practice-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px 10px;
        }

        .box {
            display: flex;
            width: 80px;
            height: 80px;
            background-color: green;
            text-align: center;
            justify-content: center;
            align-items: center;
            color: red;
        }
    </style>
</head>

<body>
    <div class="practice-area">
        <div class="box">1번상자</div>
        <div class="box">2번상자</div>
        <div class="box">3번상자</div>
        <div class="box">4번상자</div>
        <div class="box">5번상자</div>
        <div class="box">6번상자</div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacing 실습</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-8">

    <div class="w-80 h-[150px] bg-blue-500 text-white rounded-lg border-4 border-blue-700">
        <div class="p-6">
            <h3 class="font-bold text-lg">안쪽 여백 (Padding)</h3>
            <p class="text-xs text-blue-100">텍스트가 내부 테두리에서 지정된 간격만큼 떨어집니다.</p>
        </div>
    </div>

    <div class="m-10 w-60 h-24 bg-rose-500 text-blue-100 rounded-lg p-4">
        <h3 class="font-bold">바깥 여백 (Margin)</h3>
        <p class="text-xs">바깥 여백이 적용되어 위 상자와 일정한 거리를 유지합니다.</p>
    </div>

</body>

</html>
